# cspell:words akarshtechsuite
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write   # commit the version bump + tag, push, create the release
  id-token: write   # npm OIDC trusted publishing + provenance
  issues: write
  pull-requests: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags for version analysis
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Author + committer for the generated release commit.
          GIT_AUTHOR_NAME: akarshtechsuite
          GIT_AUTHOR_EMAIL: akarsh@techsuite.io
          GIT_COMMITTER_NAME: akarshtechsuite
          GIT_COMMITTER_EMAIL: akarsh@techsuite.io
