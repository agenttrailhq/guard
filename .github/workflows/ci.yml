name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Spell check
        run: pnpm spell

      - name: Types
        run: pnpm typecheck

      # The hook bundle is committed because the plugin runs it directly, so a rebuild must
      # reproduce it byte for byte.
      - name: Build and compare the committed hook bundle
        run: |
          pnpm build
          git diff --exit-code -- plugin/scripts/guard-hook.mjs

      - name: Tests
        run: pnpm test

  # Packs the tarball, checks its contents, then installs it in an empty directory and runs it.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pack
        run: |
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack

      - name: Check tarball contents
        run: |
          v=$(node -p "require('./package.json').version")
          python3 scripts/check-tarball.py /tmp/pack/*.tgz \
            --package @agenttrail/guard --version "$v"

      - name: Install and run the tarball
        run: bash scripts/smoke-test.sh /tmp/pack/*.tgz
