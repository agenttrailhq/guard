# esbuild's postinstall is not needed: its binary comes from the platform optional dependency.
allowBuilds:
  esbuild: false

# Exact versions newer than pnpm's 24-hour minimum release age. pnpm applies only the first
# entry for a package, so list all of a package's versions in one entry, joined with `||`.
# Remove the guardrails entry after 2026-11-14 06:04 UTC.
minimumReleaseAgeExclude:
  - "@agenttrail/guardrails@0.2.9"
